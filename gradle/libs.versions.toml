[versions]
agp                 = "8.7.3"
kotlin              = "2.1.0"
ksp                 = "2.1.0-1.0.29"
hilt                = "2.54"
room                = "2.7.0"
navigation          = "2.8.5"
firebaseBom         = "33.8.0"
googleServices      = "4.4.2"
vbpd                = "2.0.4"
coreKtx             = "1.15.0"
appcompat           = "1.7.0"
material            = "1.12.0"
activity            = "1.10.0"
fragment            = "1.8.5"
lifecycle           = "2.8.7"
coroutines          = "1.9.0"
playServicesAuth    = "21.3.0"
junit               = "4.13.2"
junitExt            = "1.2.1"
espresso            = "3.6.1"

[libraries]
# Core
androidx-core-ktx           = { group = "androidx.core",            name = "core-ktx",          version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat",        name = "appcompat",          version.ref = "appcompat" }
material                    = { group = "com.google.android.material", name = "material",          version.ref = "material" }
androidx-activity-ktx       = { group = "androidx.activity",         name = "activity-ktx",       version.ref = "activity" }
androidx-fragment-ktx       = { group = "androidx.fragment",         name = "fragment-ktx",       version.ref = "fragment" }

# Lifecycle / ViewModel
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }

# Navigation Component
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui       = { group = "androidx.navigation", name = "navigation-ui-ktx",       version.ref = "navigation" }

# Hilt
hilt-android    = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler   = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Room
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Firebase
firebase-bom        = { group = "com.google.firebase", name = "firebase-bom",         version.ref = "firebaseBom" }
firebase-auth       = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore  = { group = "com.google.firebase", name = "firebase-firestore-ktx" }

# Google Sign-In
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# View Binding (VBPD)
vbpd            = { group = "dev.androidbroadcast.vbpd", name = "vbpd",            version.ref = "vbpd" }
vbpd-reflection = { group = "dev.androidbroadcast.vbpd", name = "vbpd-reflection", version.ref = "vbpd" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Test
junit                      = { group = "junit",                        name = "junit",                          version.ref = "junit" }
androidx-junit             = { group = "androidx.test.ext",            name = "junit",                          version.ref = "junitExt" }
androidx-espresso-core     = { group = "androidx.test.espresso",       name = "espresso-core",                  version.ref = "espresso" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",        version.ref = "coroutines" }

[plugins]
android-application              = { id = "com.android.application",              version.ref = "agp" }
kotlin-android                   = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
ksp                              = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
hilt                             = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
google-services                  = { id = "com.google.gms.google-services",       version.ref = "googleServices" }
androidx-navigation-safeargs     = { id = "androidx.navigation.safeargs.kotlin",  version.ref = "navigation" }
